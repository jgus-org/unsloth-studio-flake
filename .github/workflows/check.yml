name: Check dual-stack behavior

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dual-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - uses: jgus-org/flake-lib/.github/actions/fleet-nix-cache@v1
        with:
          token: ${{ secrets.ATTIC_TOKEN }}

      - run: nix build --no-link .#checks.x86_64-linux.dual-stack
