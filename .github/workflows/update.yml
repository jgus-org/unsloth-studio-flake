name: Update branches

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  MINIMUM_TRACKING_VERSION: "0.1.70-beta"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Orchestrate per-version branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The full GPU application does not fit on a runner. Each branch's update-version still builds the focused source/entrypoint dual-stack regression before publication.
          SKIP_BUILD: "1"
        run: nix run .#update-branches
